version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: incidentsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidentsync
      POSTGRES_PASSWORD: incidentsync
      POSTGRES_DB: incidentsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: incidentsync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

